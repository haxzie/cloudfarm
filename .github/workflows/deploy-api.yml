name: Deploy API

# Workers Builds cannot build this Worker: its container image is built from
# apps/api/Dockerfile, and Cloudflare's builders have no Docker daemon — the
# build fails in `verifyDockerInstalled`. GitHub's ubuntu runners ship Docker,
# so the API deploys from here while the web Worker stays on Workers Builds.
on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Deploy
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # Builds the container image and the Worker, then uploads both.
        run: pnpm exec cf deploy
